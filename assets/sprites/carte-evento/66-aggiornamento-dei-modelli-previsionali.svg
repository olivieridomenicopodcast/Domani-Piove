<svg width="100" height="140" class="spr card evt " viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" role="img" ><title>Evento #66 Aggiornamento dei modelli previsionali</title><rect x="1.5" y="1.5" width="97" height="137" rx="7" fill="#f4f1ea" stroke="#2f3a4a" stroke-width="2"/>
      <rect x="4" y="4" width="92" height="15" rx="4" fill="#2c6b4a"/><text x="50" y="14" text-anchor="middle" font-size="6.4" letter-spacing=".9" font-weight="700" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">PROTEZIONE CIVILE</text>
      <text x="50" y="31" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1f2530" font-family="Georgia, 'Times New Roman', serif">Aggiornamento dei</text><text x="50" y="40.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1f2530" font-family="Georgia, 'Times New Roman', serif">modelli</text><text x="50" y="50" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1f2530" font-family="Georgia, 'Times New Roman', serif">previsionali</text>
      <text x="50" y="58.5" text-anchor="middle" font-size="5.8" letter-spacing=".5" font-weight="700" fill="#2c6b4a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">POSITIVA</text>
      
      
      <text x="50" y="76" text-anchor="middle" font-size="6.5" fill="#2b2216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Il giocatore che pesca</text><text x="50" y="84.4" text-anchor="middle" font-size="6.5" fill="#2b2216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">questa carta guarda in</text><text x="50" y="92.8" text-anchor="middle" font-size="6.5" fill="#2b2216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">anticipo la prossima</text><text x="50" y="101.2" text-anchor="middle" font-size="6.5" fill="#2b2216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Carta Evento del mazzo,</text><text x="50" y="109.6" text-anchor="middle" font-size="6.5" fill="#2b2216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">senza rivelarla agli</text><text x="50" y="118" text-anchor="middle" font-size="6.5" fill="#2b2216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">altri.</text>
      <text x="94" y="134" text-anchor="end" font-size="5.4" fill="#8a8473" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">#66</text></svg>